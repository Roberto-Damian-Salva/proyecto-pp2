<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar | Aurea Salones</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./extras.css">
</head>
<body>
<main class="auth">
  <div class="auth-card">
    <div class="tabs" role="tablist">
      <button type="button" class="is-active" data-tab="login" role="tab" aria-selected="true">Ingresar</button>
      <button type="button" data-tab="registro" role="tab" aria-selected="false">Crear cuenta</button>
    </div>

    <!-- Formulario de login -->
    <form id="form-login" novalidate>
      <label>Correo electrónico
        <input name="email" type="email" autocomplete="email" placeholder="tu@email.com">
        <span class="field-error" data-error-for="email"></span>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password">
        <span class="field-error" data-error-for="password"></span>
      </label>
      <p class="form-msg" role="alert"></p>
      <button class="primary-button" type="submit">Ingresar</button>
    </form>

    <!-- Formulario de registro -->
    <form id="form-registro" hidden novalidate>
      <label>Nombre completo
        <input name="nombre" autocomplete="name" placeholder="Tu nombre">
        <span class="field-error" data-error-for="nombre"></span>
      </label>
      <label>Correo electrónico
        <input name="email" type="email" autocomplete="email" placeholder="tu@email.com">
        <span class="field-error" data-error-for="email"></span>
      </label>
      <label>Contraseña (mínimo 8 caracteres)
        <input name="password" type="password" autocomplete="new-password">
        <span class="field-error" data-error-for="password"></span>
      </label>
      <label>Repetir contraseña
        <input name="confirmar" type="password" autocomplete="new-password">
        <span class="field-error" data-error-for="confirmar"></span>
      </label>
      <p class="form-msg" role="alert"></p>
      <button class="primary-button" type="submit">Crear cuenta</button>
    </form>
  </div>
</main>

<script src="./js/login.js"></script>
</body>
</html>
