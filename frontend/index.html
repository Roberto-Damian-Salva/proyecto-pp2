<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Salones</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Fuente moderna desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">Salones Eventos</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Mis Reservas</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Encuentra y reserva el salón ideal</h1>
            <p>Explora la disponibilidad de nuestros espacios para tus eventos.</p>
        </section>

        <section class="salones-section">
            <h2>Salones Disponibles</h2>
            <div id="salones-grid" class="grid">
                <p class="loading">Cargando salones...</p>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
